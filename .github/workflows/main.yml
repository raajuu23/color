name: Run JALWA Bot

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - run: pip install python-telegram-bot aiohttp
      
      - run: python color.py
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
